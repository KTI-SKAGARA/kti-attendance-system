<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- KTI SKAGARA Logo -->
  <!-- Orange wedge (upper left) -->
  <polygon points="40,30 100,30 40,110" fill="#E8922D"/>
  <!-- Navy vertical bar (lower left) -->
  <polygon points="40,110 100,30 100,110 40,170" fill="#1A2D4A"/>
  <!-- Navy upper-right arm -->
  <polygon points="100,30 160,30 100,110" fill="#1A2D4A"/>
  <!-- Navy lower-right arm -->
  <polygon points="100,110 160,170 100,170" fill="#1A2D4A"/>
  <polygon points="100,110 160,30 160,110" fill="#1A2D4A"/>
  <!-- Orange accent squares -->
  <rect x="140" y="20" width="16" height="16" rx="2" fill="#E8922D"/>
  <rect x="162" y="20" width="16" height="16" rx="2" fill="#E8922D"/>
</svg>
